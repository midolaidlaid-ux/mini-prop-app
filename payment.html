<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Prop Challenge - الدفع</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        button { padding: 15px 30px; margin: 10px; font-size: 18px; }
    </style>
</head>
<body>
    <h1>أكمل الدفع</h1>
    <p id="planInfo">جارٍ التحميل...</p>
    <p>طرق الدفع: USDT TRC20 / BEP20</p>
    <button onclick="confirmPayment()">تم الدفع</button>

    <script>
        const plan = localStorage.getItem('plan');
        document.getElementById('planInfo').innerText = `لقد اخترت خطة: ${plan}$`;

        function confirmPayment() {
            // يمكن إضافة توليد توكن هنا لاحقًا
            localStorage.setItem('paid', true);
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
