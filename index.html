<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Prop Challenge - اختر العرض</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        button { padding: 15px 30px; margin: 10px; font-size: 18px; }
    </style>
</head>
<body>
    <h1>اختر العرض الذي تريد</h1>
    <button onclick="selectPlan(10)">10$ → حساب 1000$</button>
    <button onclick="selectPlan(20)">20$ → حساب 3000$</button>
    <button onclick="selectPlan(30)">30$ → حساب 5000$</button>

    <script>
        function selectPlan(amount) {
            localStorage.setItem('plan', amount);
            window.location.href = 'payment.html';
        }
    </script>
</body>
</html>
