<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prop Challenge</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #f5f5f5;
            padding: 50px;
        }

        .container {
            background: #fff;
            padding: 30px;
            border-radius: 10px;
            display: inline-block;
        }

        .offers button {
            margin: 10px;
            padding: 15px 30px;
            font-size: 18px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            transition: background 0.3s;
        }

        .offers button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>اختر عرض التحدي</h1>
        <div class="offers">
            <button id="offer10">10$ - حساب 1000$</button>
            <button id="offer20">20$ - حساب 3000$</button>
            <button id="offer30">30$ - حساب 5000$</button>
        </div>
    </div>

    <script>
        // دوال الأزرار وتخزين القيمة المختارة + توجيه المستخدم
        document.getElementById('offer10').onclick = function() {
            localStorage.setItem('selectedOffer', '1000');
            window.location.href = "payment.html";
        };

        document.getElementById('offer20').onclick = function() {
            localStorage.setItem('selectedOffer', '3000');
            window.location.href = "payment.html";
        };

        document.getElementById('offer30').onclick = function() {
            localStorage.setItem('selectedOffer', '5000');
            window.location.href = "payment.html";
        };
    </script>
</body>
</html>
