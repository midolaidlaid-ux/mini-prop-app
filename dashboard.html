<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>Prop Challenge Dashboard</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: #fff;
      padding: 20px;
      text-align: center;
    }

    .card {
      background: #111827;
      border-radius: 10px;
      padding: 20px;
      max-width: 400px;
      margin: auto;
    }

    h2 {
      margin-bottom: 10px;
    }

    #btc-price {
      font-size: 32px;
      margin: 15px 0;
    }

    button {
      padding: 10px 20px;
      margin: 10px;
      font-size: 16px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }

    .buy {
      background: #16a34a;
      color: white;
    }

    .sell {
      background: #dc2626;
      color: white;
    }
  </style>
</head>

<body>

  <div class="card">
    <h2>BTCUSDT</h2>
    <div id="btc-price">Loading...</div>

    <button class="buy">Buy</button>
    <button class="sell">Sell</button>
  </div>

  <script>
    async function loadBTCPrice() {
      try {
        const response = await fetch(
          "https://prop-backend-32qf.onrender.com/price/crypto/btc",
          { mode: "cors" }
        );
        const data = await response.json();

        document.getElementById("btc-price").innerText =
          data.price.toFixed(2) + " $";
      } catch (err) {
        document.getElementById("btc-price").innerText =
          "خطأ في جلب السعر";
      }
    }

    // تحديث السعر كل ثانية
    setInterval(loadBTCPrice, 1000);
    loadBTCPrice();
  </script>

</body>
</html>
