<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>Prop Challenge - Dashboard</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        #price { font-size: 24px; margin-bottom: 20px; }
        button { padding: 10px 20px; margin: 5px; }
        #balance, #equity, #pnl { margin: 5px 0; }
    </style>
</head>
<body>
    <h1>لوحة التحكم - Prop Challenge</h1>
    <div id="price">جارٍ التحميل...</div>
    <div id="balance">Balance: $1000</div>
    <div id="equity">Equity: $1000</div>
    <div id="pnl">PnL: $0</div>
    <button onclick="buy()">Buy</button>
    <button onclick="sell()">Sell</button>

    <script>
        let balance = 1000;
        let equity = 1000;
        let pnl = 0;

        function updateDisplay() {
            document.getElementById('balance').innerText = `Balance: $${balance.toFixed(2)}`;
            document.getElementById('equity').innerText = `Equity: $${equity.toFixed(2)}`;
            document.getElementById('pnl').innerText = `PnL: $${pnl.toFixed(2)}`;
        }

        function buy() {
            let change = Math.random() * 50;
            pnl += change;
            equity = balance + pnl;
            updateDisplay();
        }

        function sell() {
            let change = Math.random() * -50;
            pnl += change;
            equity = balance + pnl;
            updateDisplay();
        }

        async function getPrice(symbol) {
            try {
                const response = await fetch(`https://prop-backend-32qf.onrender.com/price/crypto/${symbol}`);
                const data = await response.json();
                if(data.price) {
                    document.getElementById('price').innerText = `${symbol.toUpperCase()}: $${data.price}`;
                } else {
                    document.getElementById('price').innerText = 'خطأ في جلب السعر';
                }
            } catch (err) {
                document.getElementById('price').innerText = 'خطأ في الاتصال بالـ Backend';
            }
        }

        window.onload = () => {
            getPrice('btc'); 
            updateDisplay();
        }
    </script>
</body>
</html>
